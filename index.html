<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pink Flask Lab</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #f2f7fb; --chip: rgba(14, 22, 34, .7); --gold: #ffd36b; --green: #4fe08a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font: 500 15px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif; }
  body { background: linear-gradient(180deg, #e9dcc8 0%, #d9c3a3 55%, #a9865f 100%); }
  body.cam { background: #000; }
  #vid { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  body.cam #vid { display: block; } body.mirror #vid { transform: scaleX(-1); }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > .act { pointer-events: auto; }
  #card { position: fixed; left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top)); max-width: 460px; margin: 0 auto; background: var(--chip); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 16px; padding: 10px 14px; }
  #card .st { display: flex; justify-content: space-between; align-items: center; font-size: 12px; opacity: .8; margin-bottom: 2px; }
  #card .dots i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .25); margin-left: 4px; }
  #card .dots i.ok { background: var(--green); } #card .dots i.now { background: var(--gold); }
  #card .tt { font-size: 16px; font-weight: 650; }
  #card .why { font-size: 13.5px; opacity: .9; margin-top: 4px; } #card .why:empty { display: none; }
  #card .eq { color: var(--gold); font-weight: 650; margin-top: 5px; font-size: 13.5px; } #card .eq:empty { display: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding: 0 12px; }
  button { pointer-events: auto; border: 0; border-radius: 999px; padding: 11px 16px; min-height: 46px; background: var(--chip); color: var(--ink); font: 650 14px "Segoe UI", system-ui, sans-serif; backdrop-filter: blur(6px); cursor: pointer; }
  button.go { background: var(--gold); color: #1d1606; }
  button:active { transform: scale(.97); }
  #hand { position: fixed; left: -24px; top: -24px; width: 48px; height: 48px; display: none; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .6)); }
  #hand.on { display: block; }
  #hand .ring { fill: none; stroke: #fff; stroke-width: 3; transition: r .12s; } #hand .dot { fill: #fff; }
  #hand.over .ring { stroke: var(--gold); } #hand.over .dot { fill: var(--gold); }
  #hand.closed .ring { r: 10px; }
  #hand.held .ring { stroke: var(--green); } #hand.held .dot { fill: var(--green); }
  #hstat { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 116px); background: var(--chip); padding: 5px 12px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
  #hstat:empty { display: none; }
  #toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); background: rgba(255, 224, 130, .96); color: #1d1606; padding: 10px 15px; border-radius: 14px; font-size: 15px; font-weight: 600; opacity: 0; transition: opacity .3s; max-width: calc(100vw - 48px); text-align: center; }
  #toast.show { opacity: 1; }
  body.room { background: #000; }
  #touch { position: fixed; inset: 0; touch-action: none; pointer-events: auto; }
  #hint { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--chip); padding: 11px 15px; border-radius: 14px; text-align: center; max-width: calc(100vw - 56px); }
  #hint b { color: var(--gold); }
  #zoom { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }
  #zoom button { width: 48px; height: 48px; padding: 0; font-size: 24px; justify-content: center; }
  .hide { display: none !important; }
</style>
</head>
<body>
<video id="vid" playsinline muted autoplay></video>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="touch" class="hide"></div>
  <div id="card"></div>
  <div id="hint" class="hide"></div>
  <div id="zoom"><button id="bZin" aria-label="Bigger">+</button><button id="bZout" aria-label="Smaller">−</button></div>
  <svg id="hand" viewBox="0 0 48 48"><circle class="ring" cx="24" cy="24" r="16"/><circle class="dot" cx="24" cy="24" r="5"/></svg>
  <div id="toast"></div>
  <div id="hstat"></div>
  <div id="bar">
    <button id="bRoom" class="go">Put it in my room</button>
    <button id="bCam">Use my hand (camera)</button>
    <button id="bMove" class="hide">Move</button>
    <button id="bExit" class="hide">Exit</button>
    <button id="bFlip" class="hide">Switch camera</button>
    <button id="bStop" class="hide">Stop camera</button>
    <button id="bRestart">Restart</button>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<script src="./eb_shim.js"></script>
<script src="./lab_glassware.js"></script>
<script type="module" src="./app.js?v=3"></script>
</body>
</html>
